apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fullname" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3030
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: PORT
            - name: ATTESTER_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: ATTESTER_URL
            - name: RECLAIM_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: RECLAIM_ADDRESS
            - name: ZKFETCH_WRAPPER_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: ZKFETCH_WRAPPER_URL
            - name: SEPOLIA_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: agent-b-mcps
                  key: SEPOLIA_RPC_URL
            - name: PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-b-mcps
                  key: PRIVATE_KEY
            - name: NVM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-b-mcps
                  key: NVM_API_KEY
            - name: ZPI_ZKPAY_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: ZPI_ZKPAY_URL
            - name: MERCHANT_WALLET_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: MERCHANT_WALLET_ADDRESS
            - name: NVM_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NVM_ENVIRONMENT
            - name: NEVERMINED_TOKEN_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NEVERMINED_TOKEN_URL
            - name: NEVERMINED_VERIFY_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NEVERMINED_VERIFY_URL
            - name: NEVERMINED_SETTLE_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NEVERMINED_SETTLE_URL
            - name: NEVERMINED_VERIFY_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NEVERMINED_VERIFY_SCHEMA
            - name: NEVERMINED_SCHEME
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NEVERMINED_SCHEME
            - name: NEVERMINED_NETWORK
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NEVERMINED_NETWORK
            - name: NEVERMINED_DANGER_ACCEPT_INVALID_CERTS
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NEVERMINED_DANGER_ACCEPT_INVALID_CERTS
            - name: NEVERMINED_HTTP_TRACE
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NEVERMINED_HTTP_TRACE
            - name: NEVERMINED_MANDATE_ID
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NEVERMINED_MANDATE_ID
            - name: NEVERMINED_PLAN_ID
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NEVERMINED_PLAN_ID
            - name: NEVERMINED_AGENT_ID
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NEVERMINED_AGENT_ID
            - name: NEVERMINED_PAY_TO
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NEVERMINED_PAY_TO
            - name: NEVERMINED_USE_TOKEN_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NEVERMINED_USE_TOKEN_EXCHANGE
            - name: NEVERMINED_VERIFY_LEGACY_RETRY
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NEVERMINED_VERIFY_LEGACY_RETRY
            - name: NEVERMINED_MERCHANT_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: NEVERMINED_MERCHANT_ALLOWLIST
            - name: SERVER_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-b-mcps-config
                  key: SERVER_BASE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}